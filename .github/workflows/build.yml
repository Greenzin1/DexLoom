name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Seleciona o Xcode mais novo disponivel
        run: |
          ls /Applications | grep -i xcode || true
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Usando: $NEWEST"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version

      - name: Build (iOS device, sem assinatura)
        run: |
          set -o pipefail
          xcodebuild \
            -project DexLoom/DexLoom.xcodeproj \
            -scheme DexLoom \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Empacota o IPA sem assinatura
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name "DexLoom.app" | head -1)
          if [ -z "$APP" ]; then echo "DexLoom.app nao encontrado"; exit 1; fi
          echo "App: $APP"
          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa
          zip -qry ../DexLoom-unsigned.ipa Payload

      - name: Sobe o IPA
        uses: actions/upload-artifact@v4
        with:
          name: DexLoom-unsigned
          path: DexLoom-unsigned.ipa
          if-no-files-found: error
